name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run backtester smoke checks
        run: |
          python -m backtester.run_backtest --csv data/gold_real_m5.csv --strategy smc
          python -m backtester.run_backtest --csv data/gold_real_m5.csv --strategy momentum

      - name: Run 11,200+ scenario QA & latency suite
        run: python qa/run_qa_suite.py
